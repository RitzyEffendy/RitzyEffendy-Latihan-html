<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patchnote</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Patch Note</h1>
    <form action="proses.php" method="post">
        Masukkan Patch Note <br>
        <input type="text" name="nama" id="nama" required> <br>
        Masukkan Act <br>
        <input type="text" name="actEpisode" id="actEpisode"> <br>
        Masukkan Tanggal <br>
        <input type="date" name="tanggal" id="tanggal"> <br>
        Pilih Act Episode <br>
        <select name="episode" id="episode">
            <option value="Eps1">Episode 1</option>
            <option value="Eps2">Episode 2</option>
            <option value="Eps3">Episode 3</option>
            <option value="Eps4">Episode 4</option>
            <option value="Eps5">Episode 5</option>
            <option value="Eps6">Episode 6</option>
            <option value="Eps7">Episode 7</option>
            <option value="Eps8">Episode 8</option>
        </select>

    </form>
</body>
</html>
